name: CI

# Pushes run only for main; pull requests get their own run. (Pushing to a PR
# branch used to start a second, identical run through a `codex/**` push
# trigger.)
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Resolve PDFium crate version
        id: pdfium
        run: |
          VERSION=$(grep -A1 '^name = "liteparse-pdfium-sys"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # liteparse-pdfium-sys downloads PDFium into ~/.cache/pdfium-rs, outside
      # what rust-cache saves. Keeping it lets packaging find libpdfium.so
      # when a cached build skips the build script.
      - name: Cache PDFium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/pdfium-rs
          key: pdfium-x86_64-unknown-linux-gnu-${{ steps.pdfium.outputs.version }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libssl-dev pkg-config fuse libfuse2 file desktop-file-utils

      - name: Build Linux release binary
        shell: bash
        run: |
          set -euo pipefail
          TARGET=x86_64-unknown-linux-gnu
          cargo build --release --target "$TARGET"

          # rust-cache can restore a build whose libpdfium.so copy in
          # target/*/deps was pruned, and the build script does not rerun.
          # Packaging falls back to the PDFium download cache; if that missed
          # too, clean only the PDFium crate so its build script runs again.
          pdfium_present() {
            { find "target/$TARGET/release" "$HOME/.cache/pdfium-rs" \
                -name libpdfium.so -type f -print 2>/dev/null || true; } | grep -q .
          }
          if ! pdfium_present; then
            echo "libpdfium.so missing after a cached build; rebuilding liteparse-pdfium-sys"
            cargo clean -p liteparse-pdfium-sys --release --target "$TARGET"
            cargo build --release --target "$TARGET"
          fi
          pdfium_present

      - name: Package AppImage
        env:
          TAG: ci-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-gnu/release/rmdv
          APPDIR=rmdv.AppDir
          OUT="dist/rmdv-${TAG}-x86_64.AppImage"
          rm -rf "$APPDIR" dist squashfs-root appimagetool-x86_64.AppImage
          mkdir -p "$APPDIR/usr/bin" dist
          cp "$BIN" "$APPDIR/usr/bin/rmdv"

          # PDFium .so must sit next to the binary (dlopen searches current_exe
          # dir). liteparse's build script normally copies it into the build
          # tree, but its source cache is the authoritative fallback when that
          # best-effort copy is absent.
          PDFIUM_CACHE_ROOT="${XDG_CACHE_HOME:-$HOME/.cache}/pdfium-rs"
          SO=""
          if [ -d target/x86_64-unknown-linux-gnu/release ]; then
            SO=$(find target/x86_64-unknown-linux-gnu/release -name 'libpdfium.so' -type f -print -quit)
          fi
          if [ -z "$SO" ] && [ -d target ]; then
            SO=$(find target -name 'libpdfium.so' -type f -print -quit)
          fi
          if [ -z "$SO" ] && [ -d "$PDFIUM_CACHE_ROOT" ]; then
            SO=$(find "$PDFIUM_CACHE_ROOT" -name 'libpdfium.so' -type f -print -quit)
          fi
          if [ -z "$SO" ]; then
            echo "libpdfium.so not found; searched target/x86_64-unknown-linux-gnu/release, target, and $PDFIUM_CACHE_ROOT" >&2
            exit 1
          fi
          echo "Selected PDFium: $SO"
          cp "$SO" "$APPDIR/usr/bin/libpdfium.so"

          cp assets/icon.png "$APPDIR/rmdv.png"
          cat > "$APPDIR/rmdv.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=rmdv
          Exec=rmdv
          Icon=rmdv
          Type=Application
          Categories=Utility;
          DESKTOP
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/rmdv" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "b90f4a8b18967545fda78a445b27680a1642f1ef9488ced28b65398f2be7add2  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract >/dev/null
          ARCH=x86_64 ./squashfs-root/AppRun "$APPDIR" "$OUT"
          chmod +x "$OUT"

      - name: Smoke-test AppImage CLI
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE_PATH="dist/rmdv-ci-${GITHUB_SHA}-x86_64.AppImage"
          file "$APPIMAGE_PATH"
          "$APPIMAGE_PATH" --help >/tmp/rmdv-help.txt
          "$APPIMAGE_PATH" list-sections README.md >/tmp/rmdv-sections.json
          python3 -c 'import json; json.load(open("/tmp/rmdv-sections.json"))'

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      # Releases build Windows without the default `pdf` feature.
      - name: Check without default features
        run: cargo check --no-default-features --target x86_64-pc-windows-msvc

  audit:
    name: cargo audit (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Report-only until the advisory baseline is triaged: findings become a
      # warning and the job summary, not a failed check.
      - name: Audit dependencies
        shell: bash
        run: |
          set +e
          cargo audit > audit.txt 2>&1
          STATUS=$?
          set -e
          cat audit.txt
          {
            echo '## cargo audit'
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning title=cargo audit::advisories found (report-only); see the job summary"
          fi
