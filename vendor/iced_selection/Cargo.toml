[package]
edition = "2024"
rust-version = "1.88"
name = "iced_selection"
version = "0.5.0"
authors = ["pml68 <contact@pml68.dev>"]
build = false
exclude = [
    ".cargo/config.toml",
    ".builds/*",
    "docs/*",
    ".gitignore",
    ".gitattributes",
    "examples",
    "rustfmt.toml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Text selection for `iced`"
homepage = "https://sr.ht/~pml68/iced_selection"
readme = "README.md"
keywords = [
    "gui",
    "ui",
    "graphics",
    "interface",
    "widgets",
]
categories = ["gui"]
license = "MIT"
repository = "https://git.sr.ht/~pml68/iced_selection"

[package.metadata.docs.rs]
rustdoc-args = [
    "--cfg",
    "docsrs",
]
all-features = true

[features]
default = []
markdown = ["iced_widget/markdown"]

[lib]
name = "iced_selection"
path = "src/lib.rs"

[dependencies.iced_widget]
version = "0.14"

[dependencies.unicode-segmentation]
version = "1.0"

# rmdv: Chinese and Japanese word boundaries from `CFStringTokenizer`.
[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3"
default-features = false
features = ["std", "CFString", "CFStringTokenizer", "CFLocale"]

